config_version: 1

sources:
  # BLS directory listing - every file in it is synced (no file names hardcoded)
  bls_directory_url: "https://download.bls.gov/pub/time.series/pr/"

  # One-off files that have no directory listing.
  extra_files:
    acs_yg_total_population_1.json: "https://honolulu-api.datausa.io/tesseract/data.jsonrecords?cube=acs_yg_total_population_1&drilldowns=Year%2CNation&locale=en&measures=Population"

storage:
  state_volume: pr_ingestion_state
  manifest_file: manifest.json

http:
  user_agent: "Databricks BLS PR ingestion (zaidrahman13@live.com)"
  retries: 5
  backoff_factor: 2
  request_timeout_seconds: 60
  download_timeout_seconds: 600
